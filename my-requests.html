<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>My Requests — FoodBridge</title>

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link
    href="https://fonts.googleapis.com/css2?family=Fraunces:wght@500;600;700&family=Inter:wght@400;500;600;700&display=swap"
    rel="stylesheet"
  />

  <link rel="stylesheet" href="../css/style.css" />
  <link rel="stylesheet" href="../css/dashboard.css" />
  <link rel="stylesheet" href="../css/responsive.css" />
</head>
<body>

  <div class="dashboard-layout">

    <div class="sidebar-backdrop" id="sidebarBackdrop"></div>

    <aside class="sidebar" id="sidebar">
      <a href="../index.html" class="sidebar-logo">
        <span class="logo-mark">FW</span> FoodBridge
      </a>

      <div class="sidebar-section-label">Menu</div>
      <nav class="sidebar-nav">
        <a href="ngo-dashboard.html"><span class="nav-icon">🏠</span> Dashboard</a>
        <a href="available-food.html"><span class="nav-icon">🍽️</span> Available Food</a>
        <a href="my-requests.html" class="active"><span class="nav-icon">📨</span> My Requests</a>
        <a href="pickup-tracking.html"><span class="nav-icon">🚚</span> Pickup Tracking</a>
        <a href="notifications.html?role=ngo"><span class="nav-icon">🔔</span> Notifications</a>
        <a href="profile.html?role=ngo"><span class="nav-icon">👤</span> Profile</a>
      </nav>

      <div class="sidebar-footer">
        <nav class="sidebar-nav">
          <a href="login.html"><span class="nav-icon">🚪</span> Logout</a>
        </nav>
      </div>
    </aside>

    <div>
      <header class="topbar">
        <div style="display:flex;align-items:center;gap:var(--space-3);">
          <button class="sidebar-toggle" id="sidebarToggle" aria-label="Toggle menu">
            <span></span><span></span><span></span>
          </button>
          <div class="topbar-title">
            <h1>My Requests</h1>
            <span>Food you've requested from donors</span>
          </div>
        </div>

        <div class="topbar-actions">
          <div class="topbar-user">
            <div class="avatar">HT</div>
            <div class="user-meta">
              <strong>Hope Trust</strong>
              <span>NGO</span>
            </div>
          </div>
        </div>
      </header>

      <main class="dashboard-main">
        <div class="panel">
          <div class="panel-head">
            <h3>Your Requests</h3>
          </div>

          <div class="data-table-wrap">
            <table class="data-table">
              <thead>
                <tr>
                  <th>Food</th>
                  <th>Donor</th>
                  <th>Quantity</th>
                  <th>Requested Date</th>
                  <th>Pickup Date &amp; Time</th>
                  <th>Status</th>
                  <th>Action</th>
                </tr>
              </thead>
              <tbody id="myRequestsBody">
                <!-- Rows injected by js/ngo.js -->
              </tbody>
            </table>
          </div>
        </div>
      </main>
    </div>
  </div>

  <script src="../js/main.js"></script>
  <script src="../js/validation.js"></script>
  <script src="../js/ngo.js"></script>
</body>
</html>
